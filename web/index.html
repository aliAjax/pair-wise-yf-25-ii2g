<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学术会议同行评审</title>
<style>body{font:16px system-ui;max-width:960px;margin:32px auto;padding:0 16px}input,textarea,select,button{font:inherit;padding:8px;margin:4px}textarea{width:100%;height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #bbb;padding:16px;border-radius:8px}pre{white-space:pre-wrap;background:#f4f4f4;padding:12px}.scores label{display:inline-block;margin-right:12px}.locked{color:#8a6d00;background:#fff8e1;padding:8px;border-radius:6px}</style></head>
<body><h1>学术会议同行评审</h1><p>选择身份后，页面通过 <code>X-User-Id</code> 调用 JSON API。演示账号：alice、bob、r1、r2、r3、chair。评分按创新性 40%、严谨性 35%、复现性 25% 合成。</p>
<div class="grid">
<section class="panel"><h2>提交论文</h2><select id="user"><option>alice</option><option>bob</option><option>r1</option><option>r2</option><option>r3</option><option>chair</option></select><input id="title" placeholder="标题"><textarea id="abstract" placeholder="摘要（至少20字）"></textarea><button onclick="submitPaper()">提交</button></section>
<section class="panel"><h2>查看论文</h2><button onclick="loadPapers()">刷新当前身份可见论文</button><pre id="papers"></pre></section>
<section class="panel"><h2>评审表（可续写）</h2>
<p><input id="assignId" placeholder="分配 ID" style="width:8em"> <button onclick="loadMyReview()">取回我的评审</button></p>
<div class="scores">
<label>创新性 (40%)<select id="s-innovation"></select></label>
<label>严谨性 (35%)<select id="s-rigor"></select></label>
<label>复现性 (25%)<select id="s-reproducibility"></select></label>
</div>
<textarea id="reviewText" placeholder="评审意见（至少 10 字）"></textarea>
<p>合成总分预览：<strong id="preview">—</strong>（缺维度时不可提交）</p>
<button onclick="saveDraft()">暂存草稿（仅本人可见）</button>
<button onclick="submitReview()">提交（提交后锁定）</button>
<pre id="reviewResult"></pre>
</section>
<section class="panel"><h2>查看评审结果</h2>
<p><input id="reviewPaperId" placeholder="论文 ID" style="width:8em"></p>
<button onclick="loadReviews()">查看（主席：维度分/总分；作者：决定后维度均分）</button>
<pre id="reviews"></pre></section>
</div>
<script>
const SCORE_KEYS=["innovation","rigor","reproducibility"];
const WEIGHTS={innovation:0.4,rigor:0.35,reproducibility:0.25};
const headers={"Content-Type":"application/json","X-User-Id":document.querySelector("#user").value};
document.querySelector("#user").onchange=e=>headers["X-User-Id"]=e.target.value;
async function api(url,opt={}){const r=await fetch(url,{...opt,headers});return await r.json()}
async function submitPaper(){alert(JSON.stringify(await api("/api/papers",{method:"POST",body:JSON.stringify({title:title.value,abstract:abstract.value})}),null,2))}
async function loadPapers(){papers.textContent=JSON.stringify(await api("/api/papers"),null,2)}

// 仅做展示用的预览；权威计算在服务端 scoring 模块。
for(const key of SCORE_KEYS){
  const sel=document.getElementById("s-"+key);
  sel.innerHTML='<option value="">未填</option>'+[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join("");
  sel.onchange=refreshPreview;
}
function refreshPreview(){
  let total=0;
  for(const key of SCORE_KEYS){
    const v=Number(document.getElementById("s-"+key).value);
    if(!v){preview.textContent="—";return}
    total+=v*WEIGHTS[key];
  }
  preview.textContent=total.toFixed(2);
}
function readScores(){
  const scores={};
  for(const key of SCORE_KEYS){
    const v=document.getElementById("s-"+key).value;
    if(v)scores[key]=Number(v);
  }
  return scores;
}
async function loadMyReview(){
  const id=assignId.value.trim();
  const data=await api(`/api/assignments/${id}/review`);
  reviewResult.textContent=JSON.stringify(data,null,2);
  if(data.error)return;
  for(const key of SCORE_KEYS){
    const v=data.scores?data.scores[key]:null;
    document.getElementById("s-"+key).value=v??"";
  }
  reviewText.value=data.review_text??"";
  refreshPreview();
  const locked=!!data.locked;
  for(const key of SCORE_KEYS)document.getElementById("s-"+key).disabled=locked;
  reviewText.disabled=locked;
  reviewResult.textContent=JSON.stringify(data,null,2)+(locked?"\n\n⚠ 评审已提交，内容原样锁定。":"");
}
async function saveDraft(){
  const id=assignId.value.trim();
  const data=await api(`/api/assignments/${id}/review-draft`,{method:"POST",body:JSON.stringify({scores:readScores(),text:reviewText.value})});
  reviewResult.textContent=JSON.stringify(data,null,2);
}
async function submitReview(){
  const missing=SCORE_KEYS.filter(k=>!document.getElementById("s-"+k).value);
  if(missing.length){alert("创新性、严谨性、复现性三项都填写后才能提交。");return}
  const id=assignId.value.trim();
  const data=await api(`/api/assignments/${id}/review`,{method:"POST",body:JSON.stringify({scores:readScores(),text:reviewText.value})});
  reviewResult.textContent=JSON.stringify(data,null,2);
  if(!data.error)loadMyReview();
}
async function loadReviews(){
  const id=reviewPaperId.value.trim();
  reviews.textContent=JSON.stringify(await api(`/api/papers/${id}/reviews`),null,2);
}
</script></body></html>
